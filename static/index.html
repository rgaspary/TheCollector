<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheCollector</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#1f1e1b">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<main>
  <header>
    <div class="title-row">
      <h1><img src="/static/icon.svg" alt="" class="logo">TheCollector <span id="version" class="version"></span></h1>
      <nav class="top-links" aria-label="Settings and help">
        <button type="button" class="link" data-open="settings">Settings</button>
        <button type="button" class="link" data-open="help">Help</button>
      </nav>
    </div>
    <p class="sub">Turn a streaming playlist into one your music app can play from your own files. Anything you don't have goes on a missing-songs list.</p>
    <p id="library-badge" class="account" hidden></p>
  </header>

  <nav aria-label="Progress">
    <ol class="steps">
      <li>Library</li><li>Service</li><li>Playlist</li><li>Review</li><li>Export</li><li>Missing</li><li>Done</li>
    </ol>
  </nav>

  <div id="notice" class="notice" role="status" hidden></div>
  <div id="error" class="error" role="alert" hidden></div>

  <div class="stage"></div>
</main>
</body>
</html>
