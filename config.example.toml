# TheCollector configuration. Paths may start with ~.
# Your own copy lives in config.toml (created from this file on first run, never committed).

[spotify]
# Only read once, to move an existing Client ID into TheCollector's saved settings.
# New installs enter the Client ID in the app. The SPOTIFY_CLIENT_ID environment variable also works.
client_id = ""

[library]
# Which music app's library to match against: strawberry, itunes, mediamonkey or folder.
type = "strawberry"
# The library file. Leave empty to use the usual location for this library type on this computer.
path = ""
# Music folders to scan when type = "folder".
folders = ["~/Music"]

[export]
# Where playlists and missing-song lists are saved unless you pick another folder in the app.
# Leave these out to use the Playlists folder inside your Music folder, and your Documents folder.
# playlist_dir = "~/Music/Playlists"
# missing_dir = "~/Documents"

[vault]
# Optional: remove this section if you don't use NextUp.
# The vault path and name are read from NextUp's config.
nextup_config = "~/dev/NextUp/config.toml"
# Vault folder for "<Playlist> missing tracks" notes.
notes_folder = "Entertainment/Missing Tracks"
# NextUp area id put in each note's frontmatter.
area = "music"

[server]
host = "127.0.0.1"
port = 8766
